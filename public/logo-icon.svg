<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222533" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Metallic Ribbon Chrome Gradient -->
    <linearGradient id="ribbon-main" x1="30" y1="170" x2="170" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="15%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="88%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Front Overlapping Strand -->
    <linearGradient id="ribbon-front" x1="70" y1="50" x2="140" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Underside Shadow -->
    <linearGradient id="ribbon-under" x1="130" y1="60" x2="60" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#64748B" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- 3D Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="4" stdDeviation="3.5" flood-color="#090d16" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Dark Grid Background -->
  <rect width="200" height="200" rx="32" fill="#0d0e15" />
  <rect width="200" height="200" rx="32" fill="url(#grid)" />
  <circle cx="100" cy="100" r="75" fill="url(#ambient-glow)" />

  <!-- Under Strand -->
  <path
    d="M 98 94
       C 112 76, 134 52, 154 58
       C 174 64, 180 88, 162 110
       C 144 132, 118 152, 98 120
       C 80 92, 58 82, 42 90
       C 24 100, 22 126, 40 144
       C 58 162, 86 160, 102 130
       C 106 122, 104 112, 98 94 Z"
    fill="none"
    stroke="url(#ribbon-under)"
    stroke-width="19"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Main Ribbon -->
  <path
    d="M 98 94
       C 112 76, 134 52, 154 58
       C 174 64, 180 88, 162 110
       C 144 132, 118 152, 98 120
       C 80 92, 58 82, 42 90
       C 24 100, 22 126, 40 144
       C 58 162, 86 160, 102 130
       C 106 122, 104 112, 98 94 Z"
    fill="none"
    stroke="url(#ribbon-main)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Overlapping Strand -->
  <path
    d="M 82 72
       C 96 82, 118 88, 136 78
       C 154 68, 162 58, 150 58
       C 132 54, 112 74, 98 92
       C 92 102, 90 114, 94 126"
    fill="none"
    stroke="url(#ribbon-front)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#shadow)"
  />

  <!-- Specular Highlights -->
  <path
    d="M 124 64
       C 142 54, 162 58, 166 76
       C 168 90, 156 110, 142 124"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-opacity="0.9"
  />

  <path
    d="M 38 96
       C 28 106, 26 126, 42 142
       C 56 156, 80 154, 94 130"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-opacity="0.9"
  />

  <path
    d="M 94 86 C 98 94, 104 102, 110 110"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.95"
  />
</svg>
